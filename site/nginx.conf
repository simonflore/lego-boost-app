server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Repeated in each location: nginx drops server-level add_header once a
  # location adds its own.
  set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'";

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ =404;
  }

  # Web app (single-page): unknown paths fall back to its index.html.
  location /app/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /app/index.html;
  }

  # Hashed bundles never change.
  location /app/_expo/static/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
